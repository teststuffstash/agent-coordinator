# ci.yaml — PR gate: the coordinator image must still BUILD. A dep/lock bump that breaks the build is
# caught HERE, on the PR, instead of on the master push that ships it. This is the required status check
# `ci` that gates the merge path (renovate auto-merge + update-pr-branch, FU-014/FU-041) — without a
# PR-triggered check, an armed PR could never see green and the updater would never bring it current.
#
# No push: build-image.yaml owns the ghcr push on master; this is a no-push verification build on the
# same ARC tier (homelab-ephemeral), exercising the real coordinator/Dockerfile.
name: CI

on:
  pull_request:
  workflow_dispatch:

# One live run per PR (org standard — homelab docs/ci.md §Concurrency, from oracle-fleet#222):
# a superseded PR head's run cancels instead of queuing; push/master runs keep their own serial
# group and never cancel (a cancelled push run can leave a publish half-written).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: homelab-ephemeral
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build coordinator image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: coordinator/Dockerfile
          platforms: linux/amd64
          push: false

      # pin-only-lint (ADR-100 addendum): the `.github/workflows` pin gate. Runs from homelab's
      # master script (sparse checkout) — a fix there reaches every caller at once. The lint
      # allows only verified action pin bumps (SHA # tag) in workflow files; any other edit
      # takes the operator path to master where this check does not run.
      - name: Fetch homelab's pin-only-lint at master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: teststuffstash/homelab
          ref: master
          path: .homelab-lint
          sparse-checkout: |
            scripts/pin-only-lint.sh
            devbox.json
            devbox.lock
          sparse-checkout-cone-mode: false

      - name: Guarded files may only receive pin bumps (pin-only-lint)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          PIN_ONLY_REPO: ${{ github.workspace }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          devbox run --config "$GITHUB_WORKSPACE/.homelab-lint" -- bash "$GITHUB_WORKSPACE/.homelab-lint/scripts/pin-only-lint.sh" "$BASE_SHA"
