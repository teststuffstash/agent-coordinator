# Build + push the agent-coordinator image to ghcr on every master push. Single responsibility: this
# repo produces one artifact, so there are no path filters or "is this a deploy?" rules — every push
# to master builds. The tag is content-addressed by the Dockerfile (same Dockerfile → same tag), so a
# rebuild is reproducible; note the `@latest` apt/npm pins (gh, claude) can still drift the image
# content without a Dockerfile change — pin them if bit-reproducibility matters.
#
# amd64-only (the coordinator runs in-cluster on x86). Self-hosted ARC runner (homelab-ephemeral);
# ghcr push auth is the job's GITHUB_TOKEN (packages: write) — no extra secret. Mirrors agent-runtime.
name: build-image

on:
  push:
    branches: [master]
    paths: # only rebuild when the image content can actually change (not on doc-only commits)
      - "coordinator/**"
      - ".github/workflows/build-image.yaml"
  workflow_dispatch:

jobs:
  image:
    runs-on: homelab-ephemeral
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Version = commit-date CalVer + short git sha (2026.<m>.<d>-g<sha>) — consistent with the
      # openrouter-operator / sleep-ingester deploy versioning. Traceable (tag → commit); the path
      # filter above keeps it from churning on changes that don't affect the image.
      - name: Compute version
        id: ver
        run: |
          SHA=$(git rev-parse --short=12 HEAD)
          DATE=$(git show -s --format=%cd --date=format:'%Y.%-m.%-d' HEAD)
          echo "tag=${DATE}-g${SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: coordinator/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/agent-coordinator:${{ steps.ver.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/agent-coordinator:latest

  # deploy-pin: bump homelab agents/images.env + every manifest that pins this image (the Argo
  # CronWorkflow yamls are ArgoCD-synced, so the merged bump PR rolls them near-instantly).
  # The sed is a git-grep sweep, not a file list — the 2026-07-21 Argo migration deleted
  # review-reflex.yaml and the old hardcoded path broke the whole chain silently.
  # First-party bump (CI-opened, not Renovate); skips gracefully until DEPLOY_APP_* is wired.
  deploy-pin:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: DEPLOY_APP present?
        id: gate
        run: |
          if [ -n "${{ secrets.DEPLOY_APP_ID }}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "::warning::DEPLOY_APP_ID unset — skipping images.env bump"
            echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        if: steps.gate.outputs.ok == 'true'
        id: hl
        with:
          app-id: ${{ secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homelab
      - name: Open/arm the homelab images.env + review-reflex bump PR
        if: steps.gate.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.hl.outputs.token }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          VAR=AGENT_COORDINATOR_IMAGE; IMG="ghcr.io/${OWNER}/agent-coordinator"; NEWREF="${IMG}:${TAG}"
          git clone --quiet --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/homelab.git" h && cd h
          cur=$(grep -m1 "^${VAR}=" agents/images.env | cut -d= -f2-)
          [ "$cur" = "$NEWREF" ] && { echo "images.env already ${VAR}=${NEWREF}"; exit 0; }
          git config user.name "homelab-deploy[bot]"; git config user.email "homelab-deploy[bot]@users.noreply.github.com"
          git checkout -q -B deploy/agent-coordinator
          sed -i -E "s#^(${VAR}=).*#\1${NEWREF}#" agents/images.env
          # ONE PIN, ONE FILE (homelab FU-152, 2026-08-07). This used to `git grep` the tag and
          # rewrite every manifest carrying it — 8 files under agents/coordinator/ and growing as
          # manifests were added. Seven are CODEOWNERS-owned, so the bump could never auto-merge
          # (homelab#113), and the eighth is reflexes-argo.yaml where homelab's pin-only-lint
          # permits ARC-RUNNER pins only, making the same PR structurally red.
          # agents/coordinator now renders through kustomize: the manifests carry the image with
          # NO tag and kustomization.yaml supplies it, so this single line is the whole sweep.
          # ⚠ FAIL LOUDLY if the line is missing. Silently writing nothing here would ship a PR
          # that bumps images.env alone, leaving every in-cluster pod on the OLD image while the
          # PR looks correct — the failure this lane is least able to notice.
          if ! grep -qE '^\s+newTag: ' agents/coordinator/kustomization.yaml 2>/dev/null; then
            echo "::error::agents/coordinator/kustomization.yaml has no newTag: line — the kustomize pin moved or the file is gone; refusing to open a half-bumped PR"
            exit 1
          fi
          sed -i -E "s#^(\s+newTag: ).*#\1${TAG}#" agents/coordinator/kustomization.yaml
          git commit -q -am "deploy: agent-coordinator ${TAG}"
          git push -q -f origin deploy/agent-coordinator
          PR=$(gh pr list --repo "${OWNER}/homelab" --head deploy/agent-coordinator --state open --json number --jq '.[0].number // empty')
          [ -n "$PR" ] || PR=$(gh pr create --repo "${OWNER}/homelab" --base master --head deploy/agent-coordinator \
            --title "deploy: agent-coordinator ${TAG}" --body "First-party agent-coordinator image bump (CI-opened). Coordinator/reviewer pods pick it up on next spawn; the Argo CronWorkflow pins are ArgoCD-synced and roll on merge." | grep -oE '[0-9]+$')
          # The MECHANICAL lane (homelab docs/dependency-upgrades.md 2): `automerge` makes homelab's
          # review reflex SKIP this PR (review-reflex.sh:262) — a one-line CalVer bump is not worth an
          # LLM reviewer session — and with `dependencies` the renovate-approve reflex posts the
          # mechanical approval homelab's require_approval ruleset needs, so it stops waiting on a
          # human. OUTSIDE the create-if-absent above on purpose: deploy/agent-coordinator is a
          # long-lived branch, so `gh pr create` rarely runs and a reused PR would never be labelled
          # (the trap agent-runtime PR#37 had to fix on the identical lane).
          gh pr edit "$PR" --repo "${OWNER}/homelab" --add-label automerge --add-label dependencies \
            || echo "::warning::could not label homelab#$PR — the review reflex will not skip it"
          gh pr merge "$PR" --repo "${OWNER}/homelab" --auto --squash || echo "::warning::could not arm auto-merge on homelab#$PR"
          echo "→ homelab bump PR #$PR → ${TAG}"
