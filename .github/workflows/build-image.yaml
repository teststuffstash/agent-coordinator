# Build + push the agent-coordinator image to ghcr on every master push. Single responsibility: this
# repo produces one artifact, so there are no path filters or "is this a deploy?" rules — every push
# to master builds. The tag is content-addressed by the Dockerfile (same Dockerfile → same tag), so a
# rebuild is reproducible; note the `@latest` apt/npm pins (gh, claude) can still drift the image
# content without a Dockerfile change — pin them if bit-reproducibility matters.
#
# amd64-only (the coordinator runs in-cluster on x86). Self-hosted ARC runner (homelab-ephemeral);
# ghcr push auth is the job's GITHUB_TOKEN (packages: write) — no extra secret. Mirrors agent-runtime.
name: build-image

on:
  push:
    branches: [master]
    paths: # only rebuild when the image content can actually change (not on doc-only commits)
      - "coordinator/**"
      - ".github/workflows/build-image.yaml"
  workflow_dispatch:

jobs:
  image:
    runs-on: homelab-ephemeral
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Version = commit-date CalVer + short git sha (2026.<m>.<d>-g<sha>) — consistent with the
      # openrouter-operator / sleep-ingester deploy versioning. Traceable (tag → commit); the path
      # filter above keeps it from churning on changes that don't affect the image.
      - name: Compute version
        id: ver
        run: |
          SHA=$(git rev-parse --short=12 HEAD)
          DATE=$(git show -s --format=%cd --date=format:'%Y.%-m.%-d' HEAD)
          echo "tag=${DATE}-g${SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: coordinator/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/agent-coordinator:${{ steps.ver.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/agent-coordinator:latest

  # deploy-pin: bump homelab agents/images.env to the just-built version → coordinator/reviewer pods
  # use the pinned image (off :latest) on next spawn. ⚠ The review-reflex CronJob's own image is a
  # kubectl-applied literal in review-reflex.yaml — bumped in the same PR but needs a manual re-apply.
  # First-party bump (CI-opened, not Renovate); skips gracefully until DEPLOY_APP_* is wired.
  deploy-pin:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: DEPLOY_APP present?
        id: gate
        run: |
          if [ -n "${{ secrets.DEPLOY_APP_ID }}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "::warning::DEPLOY_APP_ID unset — skipping images.env bump"
            echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/create-github-app-token@v1
        if: steps.gate.outputs.ok == 'true'
        id: hl
        with:
          app-id: ${{ secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homelab
      - name: Open/arm the homelab images.env + review-reflex bump PR
        if: steps.gate.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.hl.outputs.token }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          VAR=AGENT_COORDINATOR_IMAGE; IMG="ghcr.io/${OWNER}/agent-coordinator"; NEWREF="${IMG}:${TAG}"
          git clone --quiet --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/homelab.git" h && cd h
          cur=$(grep -m1 "^${VAR}=" agents/images.env | cut -d= -f2-)
          [ "$cur" = "$NEWREF" ] && { echo "images.env already ${VAR}=${NEWREF}"; exit 0; }
          git config user.name "homelab-deploy[bot]"; git config user.email "homelab-deploy[bot]@users.noreply.github.com"
          git checkout -q -B deploy/agent-coordinator
          sed -i -E "s#^(${VAR}=).*#\1${NEWREF}#" agents/images.env
          # keep the kubectl-applied reflex CronJob literal in sync (operator re-applies it)
          sed -i -E "s#image: ${IMG}:[^[:space:]]*#image: ${NEWREF}#g" agents/coordinator/review-reflex.yaml
          git commit -q -am "deploy: agent-coordinator ${TAG}"
          git push -q -f origin deploy/agent-coordinator
          PR=$(gh pr list --repo "${OWNER}/homelab" --head deploy/agent-coordinator --state open --json number --jq '.[0].number // empty')
          [ -n "$PR" ] || PR=$(gh pr create --repo "${OWNER}/homelab" --base master --head deploy/agent-coordinator \
            --title "deploy: agent-coordinator ${TAG}" --body "First-party agent-coordinator image bump (CI-opened). Coordinator/reviewer pods pick it up on next spawn; the review-reflex CronJob needs a manual \`kubectl apply\` to roll." | grep -oE '[0-9]+$')
          gh pr merge "$PR" --repo "${OWNER}/homelab" --auto --squash || echo "::warning::could not arm auto-merge on homelab#$PR"
          echo "→ homelab bump PR #$PR → ${TAG}"
